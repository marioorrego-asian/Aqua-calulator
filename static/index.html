<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Calculator</title>
    <meta name="description"
        content="Look up a swimmer's best aqua score per stroke on TempusOpen for the current year.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="bubbles" aria-hidden="true">
        <div class="bubble-wrap b1">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b2">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b3">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b4">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b5">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b6">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b7">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b8">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b9">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b10">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b11">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b12">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b13">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b14">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b15">
            <div class="bubble"></div>
        </div>
        <div class="bubble-wrap b16">
            <div class="bubble"></div>
        </div>
    </div>
    <div class="ocean-glow" aria-hidden="true"></div>

    <div class="page">
        <nav class="nav">
            <div class="nav-brand">
                <span class="nav-icon">💧</span>
                <span class="nav-title">Aqua Calculator</span>
            </div>
        </nav>

        <main class="main">
            <section class="search-section">
                <p class="search-hint">
                    <span>Enter a TempusOpen Swimmer ID</span>
                    <span class="tooltip-container">
                        <span class="tooltip-trigger">(?)</span>
                        <span class="tooltip-content">
                            <strong>What is Swimmer ID?</strong><br>
                            A unique number assigned to each swimmer on TempusOpen.<br><br>
                            <strong>Where to find it?</strong><br>
                            In the URL when viewing a swimmer's profile on www.tempusopen.se (e.g.,
                            <code>.../swimmers/123456/swimming</code>, where 123456 is the ID).
                        </span>
                    </span>
                </p>
                <form id="search-form" class="search-form">
                    <input type="number" id="swimmer-id" class="glass-input" placeholder="e.g. 123456" required
                        autocomplete="off">
                    <button type="submit" id="submit-btn" class="calc-btn">
                        <span id="btn-text">Calculate</span>
                        <div class="spinner hidden" id="btn-spinner"></div>
                    </button>
                </form>
                <div id="error-message" class="error-msg hidden"></div>
            </section>

            <section id="results-container" class="results hidden">
                <div class="hero">
                    <div class="hero-left">
                        <h1 id="swimmer-name" class="hero-name"></h1>
                        <p id="swimmer-meta" class="hero-meta"></p>
                    </div>
                    <div class="hero-right">
                        <div class="score-ring">
                            <span id="total-score-value" class="score-num">0</span>
                            <span class="score-unit">pts</span>
                        </div>
                    </div>
                </div>

                <div class="section-divider"></div>

                <div class="strokes-grid" id="strokes-grid"></div>
            </section>
        </main>
    </div>

    <template id="stroke-card-template">
        <div class="stroke-card glass-card">
            <div class="card-top">
                <div class="category-wrapper">
                    <h3 class="stroke-category"></h3>
                    <span class="dropdown-arrow hidden">▼</span>
                </div>
                <span class="stroke-points-badge"><span class="stroke-points"></span> pts</span>
            </div>
            <div class="card-divider"></div>
            <div class="stroke-details">
                <div class="detail-row">
                    <span class="detail-label">Event</span>
                    <span class="detail-value event-name"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Time</span>
                    <span class="detail-value event-time"></span>
                </div>
            </div>
            <div class="card-footer">
                <span class="event-date"></span>
                <span class="footer-sep">·</span>
                <span class="event-comp"></span>
            </div>
            <div class="empty-state hidden">No results this year</div>

            <div class="card-dropdown">
                <div class="dropdown-inner">
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-list"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="/script.js"></script>
</body>

</html>
