<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempus Open Stroke Profile Calculator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #22c55e;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --muted: #475569;
        --text: #0f172a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1d4ed8 180%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .container {
      width: min(980px, 100%);
      background: color-mix(in oklab, var(--card) 92%, transparent);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }
    h1 { margin-top: 0; }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    input, button {
      padding: .7rem .9rem;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
    }
    input {
      min-width: 220px;
      background: #0b1220;
      color: #fff;
    }
    button {
      background: var(--accent);
      color: #06250f;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 1.3rem; margin-bottom: .75rem; color: var(--muted); }
    .error { color: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      font-size: .95rem;
    }
    th, td {
      padding: .65rem;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }
    th { background: rgba(59, 130, 246, 0.25); }
    .summary { margin-top: .8rem; font-weight: 700; }
    .hidden { display: none; }
    @media (max-width: 640px) {
      table { font-size: .85rem; }
      th, td { padding: .5rem; }
      input { width: 100%; }
      form { align-items: stretch; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Tempus Open Stroke Profile Calculator</h1>
    <form id="calc-form">
      <input id="swimmer-id" name="swimmer_id" placeholder="Enter swimmer ID (e.g. 316250)" required />
      <button id="submit-btn" type="submit">Calculate Profile</button>
    </form>
    <div id="status" class="status"></div>

    <section id="results" class="hidden" aria-live="polite">
      <h2 id="swimmer-title"></h2>
      <table>
        <thead>
          <tr>
            <th>Stroke type</th>
            <th>Event</th>
            <th>Time</th>
            <th>Date</th>
            <th>AQUA Points</th>
          </tr>
        </thead>
        <tbody id="profile-body"></tbody>
      </table>
      <p id="combined-score" class="summary"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('calc-form');
    const swimmerIdInput = document.getElementById('swimmer-id');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const swimmerTitleEl = document.getElementById('swimmer-title');
    const profileBodyEl = document.getElementById('profile-body');
    const combinedScoreEl = document.getElementById('combined-score');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function renderResults(data) {
      swimmerTitleEl.textContent = `Swimmer: ${data.swimmer_name} (${data.swimmer_id})`;
      profileBodyEl.innerHTML = '';

      data.strokes.forEach((stroke) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${stroke.stroke_type}</td>
          <td>${stroke.event ?? 'None'}</td>
          <td>${stroke.time ?? '-'}</td>
          <td>${stroke.date ?? '-'}</td>
          <td>${stroke.aqua_points}</td>
        `;
        profileBodyEl.appendChild(row);
      });

      combinedScoreEl.textContent = `Combined Score: ${data.combined_score}`;
      resultsEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const swimmerId = swimmerIdInput.value.trim();
      if (!swimmerId) {
        setStatus('Please enter a swimmer ID.', true);
        return;
      }

      submitBtn.disabled = true;
      setStatus('Loading profile...');
      resultsEl.classList.add('hidden');

      try {
        const response = await fetch('/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ swimmer_id: swimmerId })
        });

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || 'Failed to calculate profile.');
        }

        renderResults(payload);
        setStatus('Profile loaded successfully.');
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
